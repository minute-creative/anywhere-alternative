name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: browser add-on
        if: runner.os == 'Linux'
        run: |
          for f in browser-addon/*.js; do node --check "$f"; done 2>&1 | tee build.log
          python3 packaging/browser/build_addon.py 2>&1 | tee -a build.log
      - name: fmt
        run: cargo fmt --all -- --check 2>&1 | tee fmt.log; exit ${PIPESTATUS[0]}
      - name: clippy
        run: cargo clippy --all-targets 2>&1 | tee clippy.log; exit ${PIPESTATUS[0]}
      - name: test
        run: cargo test 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      - name: build release
        run: cargo build --release 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      # The logs blob store is not reachable from everywhere; a commit
      # comment is. On failure, post the interesting lines so they can be
      # read through the API.
      - name: report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### CI failed on \`${{ matrix.os }}\`"
            for f in fmt.log clippy.log test.log build.log; do
              [ -f "$f" ] || continue
              if grep -qE "^(error|warning)|FAILED|panicked|Diff in" "$f"; then
                echo
                echo "<details><summary>$f</summary>"
                echo
                echo '```'
                grep -nE "^(error|warning)(\[|:)|^\s+-->|^\s+\|.*\^|FAILED|panicked|Diff in" "$f" | head -150
                echo '```'
                echo "</details>"
              fi
            done
          } > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md >/dev/null

  # The iPhone app: the Rust engine cross-compiled for the simulator, then
  # the Swift app built against it (unsigned; a phone build needs the
  # owner's Apple ID in Xcode).
  iphone:
    name: iPhone app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Rust engine (simulator)
        run: |
          export IPHONEOS_DEPLOYMENT_TARGET=17.0
          cargo build -p aa-mobile --release --target aarch64-apple-ios-sim 2>&1 | tee rust-ios.log; exit ${PIPESTATUS[0]}
      - name: Xcode project
        run: |
          brew install xcodegen 2>&1 | tail -2
          cd ios && xcodegen generate 2>&1 | tee ../xcodegen.log; exit ${PIPESTATUS[0]}
      - name: Swift app (simulator, unsigned)
        run: |
          cd ios && xcodebuild -project Anywhere.xcodeproj -scheme Anywhere -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee ../xcode.log; exit ${PIPESTATUS[0]}
      - name: report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### iPhone build failed"
            for f in rust-ios.log xcodegen.log xcode.log; do
              [ -f "$f" ] || continue
              echo
              echo "<details><summary>$f</summary>"
              echo
              echo '```'
              grep -nE "error|warning: unused|FAILED|panicked|\*\* BUILD" "$f" | grep -vE "^\s*$" | head -120
              echo '```'
              echo "</details>"
            done
          } > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md >/dev/null

  # Old and new copies of Anywhere must still work together: the last three
  # releases against this code, both ways round, with pretend screens.
  compat:
    name: works with older versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release tags
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: last three releases
        id: tags
        run: |
          list=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -3 | tr '\n' ' ')
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "key=$(echo $list | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: old-builds
          key: compat-old-builds-v1-${{ steps.tags.outputs.key }}
          restore-keys: compat-old-builds-v1-
      - name: build the older versions (only the first time)
        run: scripts/compat/build-old.sh ${{ steps.tags.outputs.list }} 2>&1 | tee compat.log; exit ${PIPESTATUS[0]}
      - name: build this version
        run: cargo build -p aa-host -p aa-viewer 2>&1 | tee -a compat.log; exit ${PIPESTATUS[0]}
      - name: old and new together
        run: scripts/compat/run-all.sh target/debug/aa-host target/debug/aa-viewer ${{ steps.tags.outputs.list }} 2>&1 | tee -a compat.log; exit ${PIPESTATUS[0]}
      - name: report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Compatibility test failed"
            echo
            echo '```'
            grep -vE "^\s*Compiling|^\s*Downloaded" compat.log | tail -80
            echo '```'
          } > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md >/dev/null
