name: Release

# Push a tag like v0.2.0 (or run by hand) and this builds the Mac disk
# image and the Windows installer and publishes them on the repository's
# Releases page, where anyone with the link can download them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.2.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: version
        run: |
          v="${{ github.event.inputs.version }}"
          [ -z "$v" ] && v="${GITHUB_REF_NAME#v}"
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Mac disk image
        if: runner.os == 'macOS'
        run: packaging/macos/build-dmg.sh "$VERSION" 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Windows installer
        if: runner.os == 'Windows'
        run: |
          set -o pipefail
          cargo build --release -p aa-app -p aa-host -p aa-viewer 2>&1 | tee build.log
          # Inno Setup is preinstalled on GitHub's Windows machines; install
          # it only if it is missing.
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then choco install innosetup -y --no-progress 2>&1 | tee -a build.log; fi
          "$ISCC" "/DAppVersion=$VERSION" packaging/windows/installer.iss 2>&1 | tee -a build.log

      - uses: actions/upload-artifact@v4
        with:
          name: anywhere-${{ runner.os }}
          path: dist/Anywhere-*

      - name: report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Release build failed on \`${{ matrix.os }}\`"
            echo '```'
            grep -nE "^(error|warning)(\[|:)|^\s+-->" build.log | head -40 || true
            echo "--- last lines ---"
            tail -40 build.log || true
            echo '```'
          } > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md >/dev/null

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ github.event.inputs.version }}"
          [ -z "$v" ] && v="${GITHUB_REF_NAME#v}"
          tag="v$v"
          notes="Download **Anywhere-$v-mac.dmg** for a Mac (Apple Silicon) or **Anywhere-$v-windows-setup.exe** for Windows. See the README for first-run steps."
          if gh release view "$tag" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber -R "${{ github.repository }}"
          else
            gh release create "$tag" dist/* --title "Anywhere $v" --notes "$notes" --target "${{ github.sha }}" -R "${{ github.repository }}"
          fi
