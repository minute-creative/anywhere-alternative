[package]
name = "aa-app"
description = "Anywhere Alternative: the app people open (find computers, connect, share this one)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "anywhere"
path = "src/main.rs"

[dependencies]
aa-core.workspace = true
aa-platform.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The app window: egui on the same wgpu the viewer uses.
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }

[build-dependencies]
# Windows icon resource (does nothing on other systems).
embed-resource = "3"

[lints]
workspace = true
