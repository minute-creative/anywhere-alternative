[package]
name = "aa-viewer"
description = "Anywhere Alternative viewer: shows a remote machine and sends it your input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "aa-viewer"
path = "src/main.rs"

[dependencies]
aa-core.workspace = true
aa-platform.workspace = true
anyhow.workspace = true
bytes.workspace = true
clap.workspace = true
socket2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
winit.workspace = true
wgpu.workspace = true
pollster.workspace = true
bytemuck.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true

# Game controllers (DualSense, DualShock, Xbox, Switch Pro, most others;
# USB or Bluetooth). Mac/Windows only: on Linux it needs libudev, and we
# never ship a Linux viewer.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
gilrs = "0.11"
# Raw access to DualSense controllers (USB and Bluetooth) for full
# pass-through: adaptive triggers, light bar, touchpad, motion.
hidapi = { version = "2.6", default-features = false }

[lints]
workspace = true
