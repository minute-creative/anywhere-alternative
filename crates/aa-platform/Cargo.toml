[package]
name = "aa-platform"
description = "OS-specific backends (capture, encode, decode, input) behind portable traits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aa-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
bytes.workspace = true
tracing.workspace = true
# Software H.264 (Cisco OpenH264, built from source). The universal fallback
# codec and the encoder the mock host uses so the stream is real video.
openh264.workspace = true

# Real backends are added per stage. Each one is its own module behind
# `#[cfg(target_os)]` and, where it needs a vendor SDK, its own feature flag.
#
# [target.'cfg(target_os = "macos")'.dependencies]
# objc2-screen-capture-kit, objc2-video-toolbox, core-graphics ...

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[lints]
workspace = true
