[package]
name = "aa-platform"
description = "OS-specific backends (capture, encode, decode, input) behind portable traits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aa-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
bytes.workspace = true
tracing.workspace = true
# Software H.264 (Cisco OpenH264, built from source). The universal fallback
# codec and the encoder the mock host uses so the stream is real video.
openh264.workspace = true
# Opus (bundled C source via cmake) for audio on every platform.
opus.workspace = true
# Clipboard images travel as PNG (pure Rust, so it builds everywhere).
png = "0.18"
# Every network adapter with its broadcast address, for LAN discovery.
if-addrs = "0.15"
socket2 = { workspace = true, features = ["all"] }

# Real backends are added per stage. Each one is its own module behind
# `#[cfg(target_os)]` and, where it needs a vendor SDK, its own feature flag.
#
[target.'cfg(target_os = "macos")'.dependencies]
# Apple framework bindings (generated from the SDK headers). Only the
# pieces the decoder uses are enabled; defaults pull in far more.
objc2-video-toolbox = { version = "0.3", default-features = false, features = [
    "std", "VTDecompressionSession", "VTErrors", "objc2-core-media", "objc2-core-video",
] }
objc2-core-media = { version = "0.3", default-features = false, features = [
    "std", "CMFormatDescription", "CMSampleBuffer", "CMBlockBuffer", "CMTime", "CMBase",
] }
objc2-core-video = { version = "0.3", default-features = false, features = [
    "std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std", "CFBase", "CFDictionary", "CFNumber", "CFString",
] }
# NSPasteboard.changeCount: tells us the clipboard changed without reading
# it (reading a large image every poll would be wasteful).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }

# Audio playback. cpal needs ALSA headers on Linux, which CI/dev containers
# may lack, and we never ship a Linux viewer, so it is Mac/Windows only.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
cpal.workspace = true
# The system clipboard (text and images) behind one API on Mac and Windows.
arboard = { version = "3.6", default-features = false, features = ["image-data"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Threading",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_DataExchange",
] }
# Virtual Xbox 360 / DualShock 4 controllers through the ViGEmBus driver
# (installed once on the PC; see windows/gamepad.rs).
vigem-client = { version = "0.1.4", features = ["unstable_ds4", "unstable_xtarget_notification"] }
# The `#[implement]` macro expands to `windows_core::` paths, so the crate
# must be a direct dependency even though we only use it through `windows`.
windows-core = "0.62"

[lints]
workspace = true
