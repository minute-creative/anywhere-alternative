# [target.'cfg(target_os = "macos")'.dependencies]
# objc2-screen-capture-kit, objc2-video-toolbox, core-graphics ...
#
# [target.'cfg(target_os = "windows")'.dependencies]
# windows (DXGI, D3D11, Media Foundation), vigem-client ...

