<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Anywhere Camera</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="ask">
  <h1>Use Anywhere Camera here?</h1>
  <p><strong id="site"></strong> wants to use the camera and microphone of the computer you're watching from.</p>
  <label class="check"><input type="checkbox" id="remember" checked> Remember for this site</label>
  <div class="buttons">
    <button id="no">Don't allow</button>
    <button id="yes" class="primary">Allow</button>
  </div>
  <script src="ask.js"></script>
</body>
</html>
